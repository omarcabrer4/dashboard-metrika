<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Comercial — Métrika</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--bg2:#fff;--bg3:#f0f2f7;
  --navy:#1a2342;--blue:#3b6de0;--blue2:#5b8af0;
  --green:#16a34a;--green-bg:rgba(22,163,74,.1);
  --yellow:#d97706;--yellow-bg:rgba(217,119,6,.1);
  --red:#dc2626;--red-bg:rgba(220,38,38,.1);
  --gray:#8b90a4;--border:#e5e7ee;
  --org:#16a34a;--inb:#d97706;--pag:#3b6de0;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);font-family:var(--font);font-size:14px}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--navy);display:flex;align-items:center;padding:0 20px;z-index:100;gap:12px}
.topbar-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;outline:none}
.sel option{background:#1a2342}
.refresh-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--font)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#statusMsg{font-size:11px;color:rgba(255,255,255,.5)}

/* LAYOUT */
.content{padding:70px 16px 40px;max-width:1300px;margin:0 auto}
.section-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* CANAL LEGEND */
.canal-legend{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.canal-dot{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--gray)}
.canal-dot::before{content:'';width:8px;height:8px;border-radius:50%}
.canal-dot.org::before{background:var(--org)}
.canal-dot.inb::before{background:var(--inb)}
.canal-dot.pag::before{background:var(--pag)}

/* AGENDA CARDS */
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.agenda-grid{grid-template-columns:1fr}}
.agenda-card{background:var(--bg2);border-radius:13px;border:1px solid var(--border);padding:18px;box-shadow:0 1px 4px rgba(26,35,66,.05)}
.agenda-card-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.agenda-main{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.agenda-val{font-size:38px;font-weight:800;color:var(--navy);line-height:1;font-family:var(--mono)}
.agenda-meta{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.agenda-meta-meta{font-size:11px;color:var(--gray)}
.agenda-meta-badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-gray{background:var(--bg3);color:var(--gray)}
/* Progress bar */
.prog-wrap{margin-bottom:10px}
.prog-label{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-bottom:4px}
.prog{height:6px;border-radius:4px;background:var(--bg3);overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .8s ease}
.prog-fill.green{background:var(--green)}
.prog-fill.yellow{background:var(--yellow)}
.prog-fill.red{background:var(--red)}
/* Canal bars */
.canal-bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.canal-row{display:flex;align-items:center;gap:8px}
.canal-name{font-size:10px;font-weight:600;width:32px;color:var(--gray)}
.canal-bar-wrap{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.canal-bar-fill{height:100%;border-radius:3px}
.canal-bar-fill.org{background:var(--org)}
.canal-bar-fill.inb{background:var(--inb)}
.canal-bar-fill.pag{background:var(--pag)}
.canal-val{font-size:11px;font-weight:700;font-family:var(--mono);width:28px;text-align:right}

/* SHOW UP */
.showup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.showup-grid{grid-template-columns:1fr 1fr}}
.metric-card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:16px;box-shadow:0 1px 4px rgba(26,35,66,.05)}
.metric-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.metric-val{font-size:28px;font-weight:800;color:var(--navy);line-height:1;font-family:var(--mono)}
.metric-sub{font-size:11px;color:var(--gray);margin-top:4px}
.metric-card .prog-wrap{margin-top:10px;margin-bottom:0}

/* VENTAS */
.ventas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.ventas-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.ventas-grid{grid-template-columns:1fr}}
.venta-card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:16px 18px;box-shadow:0 1px 4px rgba(26,35,66,.05)}
.venta-label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.venta-val{font-size:22px;font-weight:800;color:var(--navy);font-family:var(--mono)}
.venta-sub{font-size:11px;color:var(--gray);margin-top:3px}
.venta-canales{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.venta-canal{font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px}
.venta-canal.org{background:rgba(22,163,74,.1);color:var(--org)}
.venta-canal.inb{background:rgba(217,119,6,.1);color:var(--inb)}
.venta-canal.pag{background:rgba(59,109,224,.1);color:var(--pag)}

/* CIERRES */
.cierres-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
@media(max-width:800px){.cierres-row{grid-template-columns:repeat(3,1fr)}}
.cierre-card{background:var(--bg2);border-radius:10px;border:1px solid var(--border);padding:14px 16px;text-align:center}
.cierre-label{font-size:9px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
.cierre-val{font-size:26px;font-weight:800;color:var(--navy);font-family:var(--mono);margin-top:4px}

.no-data{text-align:center;padding:60px;color:var(--gray);font-size:13px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">Daily Comercial</div>
  <div class="topbar-right">
    <select id="mesSel" class="sel" onchange="filterSemanas()"><option>Cargando...</option></select>
    <select id="semSel" class="sel" onchange="render()"><option>Cargando...</option></select>
    <div class="live-dot"></div>
    <span id="statusMsg">Conectando...</span>
    <button class="refresh-btn" onclick="loadData()">↻</button>
  </div>
</div>

<div class="content" id="main">
  <div class="no-data">⏳ Cargando datos...</div>
</div>

<script>
const SHEET_ID='1FHijhRFjkbLRHj3l99Lf9vAa6oik-NUF-doefLa_8iI';
const SHEET_TAB='LS_Comercial_VSL';

// Metas
const META_AG_CAL=60, META_AG_SEMI=80, META_REAL=30;

// Índices columnas LS (0-based)
const C={
  mes:0,sem:1,fi:2,ff:3,
  agCal_t:4,agCal_o:5,agCal_i:6,agCal_p:7,
  agSemi_t:8,agSemi_o:9,agSemi_i:10,agSemi_p:11,
  sesConfCal:12,
  real_t:13,real_o:14,real_i:15,real_p:16,
  showUp_t:17,showUp_o:18,showUp_i:19,showUp_p:20,
  ofertas:21,pctPitch:22,
  cierres_t:23,cierres_o:24,cierres_i:25,cierres_p:26,
  c_focus:27,c_sist:28,c_acc:29,c_down:30,
  pctConv_t:31,pctConv_o:32,pctConv_i:33,pctConv_p:34,
  vol_t:35,vol_o:36,vol_i:37,vol_p:38,
  caja_t:39,caja_o:40,caja_i:41,caja_p:42,
  cash:43,ing_t:44,ing_o:45,ing_i:46,ing_p:47,
  pctCaja:48,cac:49,ticket:50,
  roasVol:51,roasCaja:52,roasCash:53,pipeline:54
};

let allRows=[];

function loadData(){
  document.getElementById('statusMsg').textContent='Actualizando...';
  const cb='gvizCb'+Math.floor(Math.random()*99999);
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(SHEET_TAB)}&headers=1`;
  const s=document.createElement('script'); s.src=url;
  window[cb]=function(resp){
    delete window[cb]; s.remove();
    try{
      allRows=resp.table.rows.slice(1).map(r=>r.c.map(c=>c?c.v:null));
      populateFilters();
      // Seleccionar semana actual (la más reciente con datos)
      autoSelectCurrent();
      render();
      document.getElementById('statusMsg').textContent='Actualizado · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    }catch(e){
      document.getElementById('statusMsg').textContent='Error';
      document.getElementById('main').innerHTML='<div class="no-data">⚠️ No se pudo conectar. Verifica que la pestaña LS_Comercial_VSL esté publicada.</div>';
    }
  };
  document.body.appendChild(s);
}

function populateFilters(){
  const meses=[...new Set(allRows.map(r=>r[C.mes]).filter(Boolean))];
  const mesSel=document.getElementById('mesSel');
  mesSel.innerHTML=meses.map(m=>`<option value="${m}">${m}</option>`).join('');
  filterSemanas();
}

function filterSemanas(){
  const mes=document.getElementById('mesSel').value;
  const sems=allRows.filter(r=>r[C.mes]===mes).map(r=>r[C.sem]);
  const semSel=document.getElementById('semSel');
  semSel.innerHTML=sems.map(s=>`<option value="${s}">${s}</option>`).join('');
}

function autoSelectCurrent(){
  // Encontrar semana más reciente con datos
  for(let i=allRows.length-1;i>=0;i--){
    const r=allRows[i];
    if(r[C.agCal_t]||r[C.real_t]||r[C.cierres_t]){
      document.getElementById('mesSel').value=r[C.mes];
      filterSemanas();
      document.getElementById('semSel').value=r[C.sem];
      return;
    }
  }
}

function getRow(){
  const mes=document.getElementById('mesSel').value;
  const sem=document.getElementById('semSel').value;
  return allRows.find(r=>r[C.mes]===mes&&r[C.sem]===sem)||null;
}

const n=v=>v==null||isNaN(v)?null:Number(v);
const pct=v=>v!=null?`${(v*100).toFixed(1)}%`:'—';
const usd=v=>v!=null?`$${v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}`:'—';
const num=v=>v!=null?Math.round(v).toLocaleString():'—';
const fx=v=>v!=null?`${v.toFixed(2)}x`:'—';

function semColor(val,target,higherBetter=true){
  if(val==null||target==null)return 'gray';
  const r=val/target;
  if(higherBetter)return r>=1?'green':r>=.7?'yellow':'red';
  return r<=1?'green':r<=1.3?'yellow':'red';
}

function progBar(val,target,higherBetter=true){
  if(val==null)return '';
  const pct=higherBetter?Math.min(100,(val/target)*100):Math.min(100,(target/val)*100);
  const col=semColor(val,target,higherBetter);
  return `<div class="prog"><div class="prog-fill ${col}" style="width:${pct}%"></div></div>`;
}

function canalBar(val,maxVal,cls){
  if(!maxVal)return `<div class="canal-bar-wrap"><div class="canal-bar-fill ${cls}" style="width:0%"></div></div>`;
  const pct=Math.min(100,(val||0)/maxVal*100);
  return `<div class="canal-bar-wrap"><div class="canal-bar-fill ${cls}" style="width:${pct}%"></div></div>`;
}

function render(){
  const row=getRow();
  if(!row){document.getElementById('main').innerHTML='<div class="no-data">Sin datos para esta semana.</div>';return;}

  const mes=row[C.mes]||'—';
  const sem=row[C.sem]||'—';

  const agCal_t=n(row[C.agCal_t]),agCal_o=n(row[C.agCal_o]),agCal_i=n(row[C.agCal_i]),agCal_p=n(row[C.agCal_p]);
  const agSemi_t=n(row[C.agSemi_t]),agSemi_o=n(row[C.agSemi_o]),agSemi_i=n(row[C.agSemi_i]),agSemi_p=n(row[C.agSemi_p]);
  const real_t=n(row[C.real_t]),real_o=n(row[C.real_o]),real_i=n(row[C.real_i]),real_p=n(row[C.real_p]);
  const showUp_t=n(row[C.showUp_t]),showUp_o=n(row[C.showUp_o]),showUp_i=n(row[C.showUp_i]),showUp_p=n(row[C.showUp_p]);
  const ofertas=n(row[C.ofertas]),pctPitch=n(row[C.pctPitch]);
  const cierres_t=n(row[C.cierres_t]),cierres_o=n(row[C.cierres_o]),cierres_i=n(row[C.cierres_i]),cierres_p=n(row[C.cierres_p]);
  const c_focus=n(row[C.c_focus]),c_sist=n(row[C.c_sist]),c_acc=n(row[C.c_acc]),c_down=n(row[C.c_down]);
  const pctConv_t=n(row[C.pctConv_t]);
  const vol_t=n(row[C.vol_t]),vol_o=n(row[C.vol_o]),vol_i=n(row[C.vol_i]),vol_p=n(row[C.vol_p]);
  const caja_t=n(row[C.caja_t]),caja_o=n(row[C.caja_o]),caja_i=n(row[C.caja_i]),caja_p=n(row[C.caja_p]);
  const cash=n(row[C.cash]),ing_t=n(row[C.ing_t]);
  const pctCaja=n(row[C.pctCaja]),cac=n(row[C.cac]),ticket=n(row[C.ticket]);
  const roasVol=n(row[C.roasVol]),roasCaja=n(row[C.roasCaja]),roasCash=n(row[C.roasCash]);
  const pipeline=n(row[C.pipeline]);

  const maxAg=Math.max(agCal_o||0,agCal_i||0,agCal_p||0)||1;
  const maxSemi=Math.max(agSemi_o||0,agSemi_i||0,agSemi_p||0)||1;
  const maxReal=Math.max(real_o||0,real_i||0,real_p||0)||1;

  let html='';

  // ── AGENDAS
  html+=`<div class="section-label">Pipeline de agendas · ${sem} ${mes}</div>
  <div class="canal-legend">
    <span class="canal-dot org">Orgánico</span>
    <span class="canal-dot inb">Inbound</span>
    <span class="canal-dot pag">Pagado</span>
  </div>
  <div class="agenda-grid">`;

  // Card Calificadas
  const colCal=semColor(agCal_t,META_AG_CAL);
  html+=`<div class="agenda-card">
    <div class="agenda-card-title">Agendas Calificadas</div>
    <div class="agenda-main">
      <div class="agenda-val">${num(agCal_t)}</div>
      <div class="agenda-meta">
        <div class="agenda-meta-meta">Meta: ${META_AG_CAL}</div>
        <div class="agenda-meta-badge badge-${colCal}">${agCal_t!=null?Math.round(agCal_t/META_AG_CAL*100)+'%':'—'} de meta</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Progreso</span><span>${num(agCal_t)} / ${META_AG_CAL}</span></div>
      ${progBar(agCal_t,META_AG_CAL)}
    </div>
    <div class="canal-bars">
      <div class="canal-row"><span class="canal-name">Org</span>${canalBar(agCal_o,maxAg,'org')}<span class="canal-val">${agCal_o||0}</span></div>
      <div class="canal-row"><span class="canal-name">Inb</span>${canalBar(agCal_i,maxAg,'inb')}<span class="canal-val">${agCal_i||0}</span></div>
      <div class="canal-row"><span class="canal-name">Pag</span>${canalBar(agCal_p,maxAg,'pag')}<span class="canal-val">${agCal_p||0}</span></div>
    </div>
  </div>`;

  // Card Semi-calificadas
  const colSemi=semColor(agSemi_t,META_AG_SEMI);
  html+=`<div class="agenda-card">
    <div class="agenda-card-title">Agendas Semi-calificadas</div>
    <div class="agenda-main">
      <div class="agenda-val">${num(agSemi_t)}</div>
      <div class="agenda-meta">
        <div class="agenda-meta-meta">Meta: ${META_AG_SEMI}</div>
        <div class="agenda-meta-badge badge-${colSemi}">${agSemi_t!=null?Math.round(agSemi_t/META_AG_SEMI*100)+'%':'—'} de meta</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Progreso</span><span>${num(agSemi_t)} / ${META_AG_SEMI}</span></div>
      ${progBar(agSemi_t,META_AG_SEMI)}
    </div>
    <div class="canal-bars">
      <div class="canal-row"><span class="canal-name">Org</span>${canalBar(agSemi_o,maxSemi,'org')}<span class="canal-val">${agSemi_o||0}</span></div>
      <div class="canal-row"><span class="canal-name">Inb</span>${canalBar(agSemi_i,maxSemi,'inb')}<span class="canal-val">${agSemi_i||0}</span></div>
      <div class="canal-row"><span class="canal-name">Pag</span>${canalBar(agSemi_p,maxSemi,'pag')}<span class="canal-val">${agSemi_p||0}</span></div>
    </div>
  </div>`;

  html+=`</div>`;

  // ── SHOW UP
  html+=`<div class="section-label">Asistencia</div>
  <div class="showup-grid">`;

  const colReal=semColor(real_t,META_REAL);
  html+=`<div class="metric-card">
    <div class="metric-label">Citas Realizadas</div>
    <div class="metric-val">${num(real_t)}</div>
    <div class="metric-sub">Meta: ${META_REAL}</div>
    <div class="prog-wrap">
      <div class="prog-label"><span></span><span>${num(real_t)} / ${META_REAL}</span></div>
      ${progBar(real_t,META_REAL)}
    </div>
    <div class="canal-bars" style="margin-top:8px">
      <div class="canal-row"><span class="canal-name">Org</span>${canalBar(real_o,maxReal,'org')}<span class="canal-val">${real_o||0}</span></div>
      <div class="canal-row"><span class="canal-name">Inb</span>${canalBar(real_i,maxReal,'inb')}<span class="canal-val">${real_i||0}</span></div>
      <div class="canal-row"><span class="canal-name">Pag</span>${canalBar(real_p,maxReal,'pag')}<span class="canal-val">${real_p||0}</span></div>
    </div>
  </div>`;

  const colSU=semColor(showUp_t,.7);
  html+=`<div class="metric-card">
    <div class="metric-label">% Show Up Rate</div>
    <div class="metric-val" style="color:var(--${colSU==='gray'?'navy':colSU})">${pct(showUp_t)}</div>
    <div class="metric-sub">Target ≥ 70%</div>
    <div class="prog-wrap" style="margin-top:10px">
      ${progBar(showUp_t,.7)}
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--gray)">
      Org: ${pct(showUp_o)} &nbsp;·&nbsp; Inb: ${pct(showUp_i)} &nbsp;·&nbsp; Pag: ${pct(showUp_p)}
    </div>
  </div>`;

  html+=`<div class="metric-card">
    <div class="metric-label">Ofertas Presentadas</div>
    <div class="metric-val">${num(ofertas)}</div>
    <div class="metric-sub">% Pitches: ${pct(pctPitch)}</div>
  </div>`;

  html+=`</div>`;

  // ── CIERRES
  html+=`<div class="section-label">Cierres</div>
  <div class="cierres-row">
    <div class="cierre-card">
      <div class="cierre-label">Total</div>
      <div class="cierre-val" style="color:var(--blue)">${num(cierres_t)}</div>
    </div>
    <div class="cierre-card">
      <div class="cierre-label">Focus</div>
      <div class="cierre-val">${num(c_focus)}</div>
    </div>
    <div class="cierre-card">
      <div class="cierre-label">Sist. Perf.</div>
      <div class="cierre-val">${num(c_sist)}</div>
    </div>
    <div class="cierre-card">
      <div class="cierre-label">Accelerate</div>
      <div class="cierre-val">${num(c_acc)}</div>
    </div>
    <div class="cierre-card">
      <div class="cierre-label">Downselling</div>
      <div class="cierre-val">${num(c_down)}</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px">
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">% Conversión</div>
      <div class="metric-val" style="color:var(--${semColor(pctConv_t,.3)==='gray'?'navy':semColor(pctConv_t,.3)})">${pct(pctConv_t)}</div>
      <div class="metric-sub">Target ≥ 30%</div>
      <div class="prog-wrap" style="margin-top:8px">${progBar(pctConv_t,.3)}</div>
    </div>
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">CAC</div>
      <div class="metric-val">${usd(cac)}</div>
      <div class="metric-sub">Por cierre</div>
    </div>
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">Ticket Promedio</div>
      <div class="metric-val">${usd(ticket)}</div>
      <div class="metric-sub">USD</div>
    </div>
  </div>`;

  // ── VENTAS
  html+=`<div class="section-label">Ventas</div>
  <div class="ventas-grid">
    <div class="venta-card">
      <div class="venta-label">Venta Volumen</div>
      <div class="venta-val">${usd(vol_t)}</div>
      <div class="venta-sub">USD · contratos firmados</div>
      <div class="venta-canales">
        <span class="venta-canal org">Org ${usd(vol_o)}</span>
        <span class="venta-canal inb">Inb ${usd(vol_i)}</span>
        <span class="venta-canal pag">Pag ${usd(vol_p)}</span>
      </div>
    </div>
    <div class="venta-card">
      <div class="venta-label">Venta Caja</div>
      <div class="venta-val">${usd(caja_t)}</div>
      <div class="venta-sub">USD · cobrado al cierre</div>
      <div class="venta-canales">
        <span class="venta-canal org">Org ${usd(caja_o)}</span>
        <span class="venta-canal inb">Inb ${usd(caja_i)}</span>
        <span class="venta-canal pag">Pag ${usd(caja_p)}</span>
      </div>
    </div>
    <div class="venta-card">
      <div class="venta-label">Cash Collected</div>
      <div class="venta-val">${usd(cash)}</div>
      <div class="venta-sub">USD · cuotas cobradas</div>
    </div>
    <div class="venta-card">
      <div class="venta-label">Ingresos Totales</div>
      <div class="venta-val" style="color:var(--green)">${usd(ing_t)}</div>
      <div class="venta-sub">Caja + Cash Collected</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">ROAS Volumen</div>
      <div class="metric-val">${fx(roasVol)}</div>
    </div>
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">ROAS Caja</div>
      <div class="metric-val">${fx(roasCaja)}</div>
    </div>
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">ROAS Cash</div>
      <div class="metric-val">${fx(roasCash)}</div>
    </div>
    <div class="metric-card" style="flex:1;min-width:140px">
      <div class="metric-label">Pipeline 7D</div>
      <div class="metric-val">${usd(pipeline)}</div>
    </div>
  </div>`;

  document.getElementById('main').innerHTML=html;
}

loadData();
</script>
</body>
</html>
