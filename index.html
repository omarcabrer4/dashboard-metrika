<style>
:root{--bg:#f5f6fa;--bg2:#fff;--bg3:#f0f1f5;--navy:#1a2342;--navy2:#243054;--blue:#3b6de0;--blue2:#5b8af0;--blue-bg:rgba(59,109,224,.08);--green:#16a34a;--green-bg:rgba(22,163,74,.08);--yellow:#d97706;--yellow-bg:rgba(217,119,6,.08);--red:#dc2626;--red-bg:rgba(220,38,38,.08);--text:#1a2342;--text2:#5a6178;--text3:#8b90a4;--border:#e5e7ee;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--shadow:0 1px 3px rgba(26,35,66,.06)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--navy);display:flex;align-items:center;padding:0 28px;z-index:100;gap:24px}
.logo{font-size:14px;font-weight:700;letter-spacing:.12em;color:#fff;text-transform:uppercase}.logo span{color:var(--blue2)}
.nav{display:flex;gap:4px;flex:1;margin-left:32px}
.nav-btn{padding:7px 16px;border-radius:8px;border:1px solid transparent;background:0 0;color:rgba(255,255,255,.55);cursor:pointer;font-size:12.5px;font-family:var(--font);transition:all .15s;font-weight:500}
.nav-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}.nav-btn.active{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.15)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.5);font-size:11px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--font)}
.content{padding:76px 28px 40px;max-width:1440px;margin:0 auto}.page{display:none}.page.active{display:block}
.page-title{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}.page-subtitle{font-size:13px;color:var(--text2);margin-bottom:24px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin:28px 0 12px;display:flex;align-items:center;gap:8px}.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:3fr 2fr}
.card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.card-value{font-size:32px;font-weight:800;color:var(--navy);line-height:1.1}.card-value.sm{font-size:24px}
.card-sub{font-size:11.5px;color:var(--text3);margin-top:6px}.card-sub .up{color:var(--green);font-weight:600}.card-sub .down{color:var(--red);font-weight:600}
.sem{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;margin-top:6px}
.sem.green{background:var(--green-bg);color:var(--green)}.sem.yellow{background:var(--yellow-bg);color:var(--yellow)}.sem.red{background:var(--red-bg);color:var(--red)}
.sem-dot{width:6px;height:6px;border-radius:50%}.sem.green .sem-dot{background:var(--green)}.sem.yellow .sem-dot{background:var(--yellow)}.sem.red .sem-dot{background:var(--red)}
.pbar-wrap{margin-top:10px}.pbar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}.pbar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.pbar-fill.green{background:var(--green)}.pbar-fill.yellow{background:var(--yellow)}.pbar-fill.red{background:var(--red)}.pbar-fill.blue{background:var(--blue)}
.owner{font-size:10px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.chart-card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:20px;box-shadow:var(--shadow)}.chart-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{text-align:left;padding:8px 12px;background:var(--bg3);color:var(--text2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border)}.tbl .num{text-align:right;font-family:var(--mono);font-size:12px}
.tbl .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}.tbl .tag.g{background:var(--green-bg);color:var(--green)}.tbl .tag.y{background:var(--yellow-bg);color:var(--yellow)}.tbl .tag.r{background:var(--red-bg);color:var(--red)}
.funnel{display:flex;align-items:center;gap:0;justify-content:center;padding:16px 0}.funnel-step{text-align:center;flex:1}
.funnel-icon{width:44px;height:44px;border-radius:12px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:18px}
.funnel-num{font-size:24px;font-weight:800;color:var(--navy)}.funnel-label{font-size:10px;color:var(--text3);font-weight:500}
.funnel-arrow{color:var(--text3);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px}.funnel-arrow span{font-size:16px}
.loading{text-align:center;padding:60px;color:var(--text3);font-size:14px}
.status-bar{font-size:10px;color:var(--text3);text-align:center;padding:8px;background:var(--bg3);border-radius:8px;margin-bottom:16px}
@media(max-width:1200px){.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.g2,.g3,.g4,.g5,.g23,.g32{grid-template-columns:1fr}.topbar{padding:0 12px}.content{padding:70px 12px 30px}.nav-btn{padding:5px 8px;font-size:10px}}
</style>
</head>

<script>
// ============ CONFIG: Google Sheet IDs ============
const SHEETS = {
  presupuesto: '1iUEoes9J_I9G51ZcUSzne3xY73HqGYA2sVkzdAgc0uU',
  ventasCobranza: '1jqRl7YFh60LOH8B0bfX5BQL6Cb7Oxzhh_rpEwCR2evQ',
  comercial: '1LptZG3-6qwjOZkENY7j-2Q48zqGBq5z1v5pM2TU8Q6I',
  operaciones: '1W_zmnc3tG4AMPuR8a4WatFRP7oVMMykqt88oP2LPE88',
  comparativo: '1VTvDaNepgtcRJEee626WL55Cg33oPhgDt-J58s9MuqI'
};
const META_MES = 1700000;
const METAS = {margenBruto:80,margenOp:45,margenNeto:15,cobranza:75,showUp:60,conversion:25,ticket:2500,roas:4,cac:20000,renovacion:80,ltv:40000,performance:8,renovacionesMeta:3,cobranzaToma:0.75};

// ===== AJUSTA AQUÍ SI ALGO NO CARGA =====
// Pestaña del RM Comercial con filas POR SEMANA (verifica el nombre exacto en tu Sheet)
const COMERCIAL_TAB_SEMANAL = 'Copia de LS_Comercial_VSL';
// Mapeo de columnas en esa pestaña (0 = columna A). Indicaciones del cliente:
const COM_COL = {
  semana: 0,        // etiqueta de semana o fecha (ajusta si no es col A)
  mes: 0,           // mes (si está en otra columna, cámbialo)
  inversion: 4,     // E - inversión publicitaria
  agendadas: 8,     // I - sesiones agendadas (antes "reservas")
  confirmadas: 9,   // J - sesiones confirmadas
  oferta: 14,       // O - oferta presentada
  cierres: 15,      // P - cierres
  ventaVol: 16,     // Q - venta volumen
  ventaCaja: 17     // R - venta caja
};
// Pestañas de performance (cópialas a tu Sheet de Operaciones)
const PERF_CUENTA_TAB = 'LS_Performance_Cuenta';
const PERF_COACH_TAB = 'LS_Performance_Coach_Mes';
// Pestaña de flujo semanal (Presupuesto Maestro). F=escenario base, G=optimista
const FLUJO_TAB = 'LS_Flujo';
const FLUJO_COL = { base: 5, optimista: 6 }; // F=5, G=6 (0-based)

// ============ GVIZ FETCH (JSONP — no CORS issues) ============
function fetchSheet(id, tab, query='') {
  return new Promise((resolve, reject) => {
    const cbName = '_cb_' + Math.random().toString(36).substring(2,10);
    const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(tab)}&headers=1${query?'&tq='+encodeURIComponent(query):''}`;
    
    const timeout = setTimeout(() => {
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Timeout conectando con "'+tab+'" — verifica que esté publicado en la web'));
    }, 15000);

    window[cbName] = function(json) {
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      try {
        if(json.status==='error'){
          reject(new Error(json.errors?.[0]?.detailed_message||json.errors?.[0]?.message||'Error en "'+tab+'"'));
          return;
        }
        const cols = json.table.cols.map(c=>c.label||c.id);
        const rows = json.table.rows.map(r=>r.c.map(c=>{
          if(!c) return null;
          if(c.v!=null) return c.v;
          if(c.f!=null) return c.f;
          return null;
        }));
        resolve({cols, rows});
      } catch(e) {
        reject(new Error('Error procesando "'+tab+'": '+e.message));
      }
    };

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      reject(new Error('No se pudo cargar "'+tab+'" — verifica que el sheet esté publicado'));
    };
    document.head.appendChild(script);
  });
}

// ============ HELPERS ============
function fmt(n,d=0){if(n==null||isNaN(n))return'—';return Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtM(n){if(n==null||isNaN(n))return'—';if(Math.abs(n)>=1e6)return'$'+fmt(n/1e6,2)+'M';return'$'+fmt(n)}
function fmtPct(n,d=0){return fmt(n,d)+'%'}
function semC(pct){return pct>=90?'green':pct>=70?'yellow':'red'}
function semL(pct){return pct>=90?'En meta':pct>=70?'Atención':'Crítico'}
function delta(c,p){if(!p)return{t:'—',c:'neutral'};const d=(c-p)/Math.abs(p)*100;return{t:(d>=0?'↑':'↓')+' '+fmt(Math.abs(d),1)+'%',c:d>=0?'up':'down'}}

function kpi(title,value,metaPct,sub,owner,bar=true){
  const sc=metaPct!=null?semC(metaPct):'';
  return`<div class="card"><div class="card-title">${title}</div><div class="card-value">${value}</div>
  ${sub?`<div class="card-sub">${sub}</div>`:''}
  ${metaPct!=null?`<div class="sem ${sc}"><div class="sem-dot"></div>${fmtPct(metaPct,0)} de meta · ${semL(metaPct)}</div>`:''}
  ${bar&&metaPct!=null?`<div class="pbar-wrap"><div class="pbar"><div class="pbar-fill ${sc}" style="width:${Math.min(100,metaPct)}%"></div></div></div>`:''}
  <div class="owner">👤 ${owner}</div></div>`;
}

// ============ DATA STORE ============
let D = {};
let charts = {};

// ============ LOAD ALL ============
async function loadAll(){
  document.getElementById('statusBar').textContent='Conectando con Google Sheets...';
  try{
    document.getElementById('statusBar').textContent='Cargando Presupuesto Maestro...';
    const edr = await fetchSheet(SHEETS.presupuesto,'_LS_Detalle');
    document.getElementById('statusBar').textContent='Cargando Ventas...';
    const lsVentas = await fetchSheet(SHEETS.ventasCobranza,'LS_Ventas');
    document.getElementById('statusBar').textContent='Cargando Cobranza...';
    const lsCob = await fetchSheet(SHEETS.ventasCobranza,'LS_Cobranza');
    document.getElementById('statusBar').textContent='Cargando Comercial...';
    const lsCom = await fetchSheet(SHEETS.comercial,'Copia de LS_Comercial_VSL');
    // Comercial semanal + performance: fallo suave (si aún no existen, no rompe el resto)
    let lsComSem=null, perfCuenta=null, perfCoach=null;
    try{ lsComSem = await fetchSheet(SHEETS.comercial, COMERCIAL_TAB_SEMANAL); }catch(e){ console.warn('Comercial semanal no disponible:',e.message); }
    try{ perfCuenta = await fetchSheet(SHEETS.operaciones, PERF_CUENTA_TAB); }catch(e){ console.warn('Performance cuenta no disponible:',e.message); }
    try{ perfCoach = await fetchSheet(SHEETS.operaciones, PERF_COACH_TAB); }catch(e){ console.warn('Performance coach no disponible:',e.message); }
  let lsFlujo=null;
  try{ lsFlujo = await fetchSheet(SHEETS.presupuesto, FLUJO_TAB); }catch(e){ console.warn('LS_Flujo no disponible:',e.message); }
    document.getElementById('statusBar').textContent='Cargando Operaciones...';
    const baseDash = await fetchSheet(SHEETS.operaciones,'Base dashboard');
    const lsLtv = await fetchSheet(SHEETS.operaciones,'Copia de LS_LTV');
    document.getElementById('statusBar').textContent='Cargando Comparativo...';
    const comp = await fetchSheet(SHEETS.comparativo,'Hoja 1');
    D.edr=edr; D.lsVentas=lsVentas; D.lsCob=lsCob; D.lsCom=lsCom; D.baseDash=baseDash; D.lsLtv=lsLtv; D.comp=comp;
    D.lsComSem=lsComSem; D.perfCuenta=perfCuenta; D.perfCoach=perfCoach; D.lsFlujo=lsFlujo;
    processData();
    renderAll();
    const now=new Date();
    document.getElementById('lastUpdate').textContent='Actualizado: '+now.toLocaleTimeString('es-MX');
    document.getElementById('statusBar').textContent='✅ Datos cargados en tiempo real desde Google Sheets · Auto-refresh cada 5 min';
  }catch(e){
    document.getElementById('statusBar').innerHTML='❌ <b>Error: '+e.message+'</b><br>Verifica: 1) Archivo → Compartir → Publicar en la web (los 5 sheets). 2) Que las pestañas LS_ no estén ocultas.';
    document.getElementById('statusBar').style.color='var(--red)';
    console.error('Dashboard error:', e);
  }
}

function processData(){
  // EDR by month
  D.months=[];D.edrData={};
  D.edr.rows.forEach(r=>{
    const metric=r[0], cat=r[1], tipo=r[2];
    const vals=r.slice(3,15).map(v=>v?Number(v):0);
    D.edrData[metric]=vals;
  });
  // Find active months (ventas > 0)
  const ventasArr = D.edrData['Ventas']||[];
  D.activeMonths = ventasArr.reduce((a,v,i)=>v>0?i+1:a,0);
  D.mi = D.activeMonths-1; // last active month index
  const mNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  D.mLabels = mNames.slice(0,D.activeMonths);

  // Ventas by type per month
  D.ventasByType={VentaNueva:[],Recurrente:[],Upselling:[],Renovacion:[]};
  const mFull=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  for(let m=0;m<12;m++){
    let vn=0,rec=0,up=0,ren=0;
    D.lsVentas.rows.forEach(r=>{
      if(r[0]===mFull[m]){
        const tipo=r[2], ing=Number(r[6])||0;
        if(tipo==='Venta Nueva')vn+=ing;
        else if(tipo==='Recurrente')rec+=ing;
        else if(tipo==='Upselling')up+=ing;
        else if(tipo==='Renovación')ren+=ing;
      }
    });
    D.ventasByType.VentaNueva.push(vn);D.ventasByType.Recurrente.push(rec);
    D.ventasByType.Upselling.push(up);D.ventasByType.Renovacion.push(ren);
  }
  // Recurrentes combinadas = recurrente + renovaciones + upselling (indicación cliente)
  D.ventasByType.RecurrenteTotal = D.ventasByType.Recurrente.map((v,i)=>v+D.ventasByType.Renovacion[i]+D.ventasByType.Upselling[i]);

  // Cobranza
  D.cobranza={esperado:[],cobrado:[],pct:[],pendiente:[],alerta:[]};
  D.lsCob.rows.forEach(r=>{
    D.cobranza.esperado.push(Number(r[2])||0);
    D.cobranza.cobrado.push(Number(r[3])||0);
    D.cobranza.pendiente.push(Number(r[4])||0);
    D.cobranza.pct.push(Number(r[5])||0);
    D.cobranza.alerta.push(r[8]||'');
  });

  // Comercial aggregated by month
  D.comercial={reservas:[],showups:[],cierres:[],ventaVol:[],ventaCaja:[],inversion:[],showUpPct:[],convPct:[],ticket:[]};
  for(let m=0;m<12;m++){
    let res=0,su=0,ci=0,vv=0,vc=0,inv=0;
    D.lsCom.rows.forEach(r=>{
      if(r[0]===mFull[m]){
        res+=Number(r[7])||0; su+=Number(r[12])||0; ci+=Number(r[15])||0;
        vv+=Number(r[16])||0; vc+=Number(r[17])||0; inv+=Number(r[4])||0;
      }
    });
    D.comercial.reservas.push(res);D.comercial.showups.push(su);D.comercial.cierres.push(ci);
    D.comercial.ventaVol.push(vv);D.comercial.ventaCaja.push(vc);D.comercial.inversion.push(inv);
    D.comercial.showUpPct.push(su>0&&res>0?su/res*100:0);
    D.comercial.convPct.push(su>0?ci/su*100:0);
    D.comercial.ticket.push(ci>0?vv/ci:0);
  }

  // Operaciones
  D.ops={coaches:{},activos:0,inactivos:0,recuperar:0};
  D.baseDash.rows.forEach(r=>{
    if(r[0]&&r[1]!=null&&typeof r[1]==='number'){
      const name=String(r[0]).trim();
      if(['Victoria','Jenny','Omar'].includes(name)){
        D.ops.coaches[name]={cuentas:r[1],cap:r[2]||40};
      }
      if(name==='Activo')D.ops.activos=r[1];
      if(name==='Inactivo')D.ops.inactivos=r[1];
      if(name==='Recuperar')D.ops.recuperar=r[1];
    }
  });

  // LTV
  D.ltv={avg:0,count:0};
  D.lsLtv.rows.forEach(r=>{
    if(r[5]!=null&&Number(r[5])>0){D.ltv.avg+=Number(r[5]);D.ltv.count++;}
  });
  if(D.ltv.count>0)D.ltv.avg=D.ltv.avg/D.ltv.count;

  // Comparativo
  D.hist={meta:[],v2026:[],v2025:[],v2024:[],v2023:[],v2022:[]};
  D.comp.rows.forEach((r,i)=>{
    if(r[0]&&typeof r[0]==='string'&&!String(r[0]).includes('Total')&&!String(r[0]).includes('Proyecci')){
      D.hist.meta.push(Number(r[1])||0);
      D.hist.v2026.push(Number(r[2])||0);
      D.hist.v2025.push(Number(r[3])||0);
      D.hist.v2024.push(Number(r[4])||0);
      D.hist.v2023.push(Number(r[5])||0);
      D.hist.v2022.push(Number(r[6])||0);
    }
  });

  // Margins
  D.margins={bruto:[],op:[],neto:[]};
  const v=D.edrData['Ventas']||[], mb=D.edrData['Margen Bruto']||[], uo=D.edrData['Utilidad Operativa']||[], un=D.edrData['Utilidad Neta']||[];
  for(let i=0;i<12;i++){
    D.margins.bruto.push(v[i]>0?mb[i]/v[i]*100:0);
    D.margins.op.push(v[i]>0?uo[i]/v[i]*100:0);
    D.margins.neto.push(v[i]>0?un[i]/v[i]*100:0);
  }

  // ===== Por Cobrar / Flujo proyectado (LS_Flujo, semanal) =====
  // Columna F (base=5) y G (optimista=6). Tomamos las próximas 4 semanas con dato.
  D.flujo={base4:0,opt4:0,baseAnio:0,optAnio:0,semanas:[]};
  if(D.lsFlujo && D.lsFlujo.rows && D.lsFlujo.rows.length){
    const rows=D.lsFlujo.rows.filter(r=>r && (r[FLUJO_COL.base]!=null || r[FLUJO_COL.optimista]!=null));
    rows.forEach((r,i)=>{
      const base=Number(r[FLUJO_COL.base])||0;
      const opt=Number(r[FLUJO_COL.optimista])||0;
      if(base!==0||opt!==0){
        const etq=String(r[0]||('S'+(i+1)));
        D.flujo.semanas.push({label:etq,base,opt});
        D.flujo.baseAnio+=base; D.flujo.optAnio+=opt;
      }
    });
    const prox=D.flujo.semanas.slice(0,4);
    D.flujo.base4=prox.reduce((a,s)=>a+s.base,0);
    D.flujo.opt4=prox.reduce((a,s)=>a+s.opt,0);
  }

  const ventasY=D.edrData['Ventas']||[];
  const unY=D.edrData['Utilidad Neta']||[];
  // Egresos mensuales = suma de rubros de gasto
  const egKeys=['Publicidad','Honorarios y Eventos','Nominas','Comisiones','Gastos Administrativos','Gastos Plataformas','Impuestos','Fiscalista','Creditos'];
  D.egresosMes=[];
  for(let i=0;i<12;i++){
    let e=0; egKeys.forEach(k=>{e+=(D.edrData[k]||[])[i]||0;});
    D.egresosMes.push(e);
  }
  D.totales={
    ingresos: ventasY.reduce((a,b)=>a+(b||0),0),
    egresos: D.egresosMes.reduce((a,b)=>a+b,0),
    utilidadNeta: unY.reduce((a,b)=>a+(b||0),0)
  };

  // ===== Comercial SEMANAL (sesiones agendadas/confirmadas/oferta/cierres + CAC) =====
  D.semanal=null;
  if(D.lsComSem && D.lsComSem.rows && D.lsComSem.rows.length){
    const rows=D.lsComSem.rows.filter(r=>r && (r[COM_COL.agendadas]!=null||r[COM_COL.cierres]!=null));
    const wk=[];
    rows.forEach((r,idx)=>{
      const ag=Number(r[COM_COL.agendadas])||0, cf=Number(r[COM_COL.confirmadas])||0,
            of=Number(r[COM_COL.oferta])||0, ci=Number(r[COM_COL.cierres])||0,
            inv=Number(r[COM_COL.inversion])||0, vc=Number(r[COM_COL.ventaCaja])||0;
      // solo filas con actividad real
      if(ag||cf||of||ci||inv||vc){
        wk.push({label:String(r[COM_COL.semana]||('S'+(idx+1))),agendadas:ag,confirmadas:cf,oferta:of,cierres:ci,inversion:inv,ventaCaja:vc,cac:ci>0?inv/ci:0});
      }
    });
    D.semanal=wk;
  }

  // ===== # Renovaciones por cliente (meta ≥3) — desde LS_LTV col 4 (Num_renovaciones) =====
  D.renov={countMeta:0,total:0,maxRenov:0};
  D.lsLtv.rows.forEach(r=>{
    const nr=Number(r[4]);
    if(r[0] && r[4]!=null && r[4]!=='' && !isNaN(nr)){
      D.renov.total++;
      if(nr>=METAS.renovacionesMeta)D.renov.countMeta++;
      if(nr>D.renov.maxRenov)D.renov.maxRenov=nr;
    }
  });

  // ===== Cuentas por coach (Victoria / Jenny) con límite 40 =====
  // (ya viene en D.ops.coaches desde Base dashboard)

  // ===== Performance por cuenta y por coach/mes =====
  D.perf={cuentas:[],coachMes:{}};
  if(D.perfCuenta && D.perfCuenta.rows){
    D.perfCuenta.rows.forEach(r=>{
      if(r[0]&&r[3]!=null&&Number(r[3])>0){
        D.perf.cuentas.push({alumno:r[0],coach:r[1],estatus:r[2],sesiones:Number(r[3])||0,
          res:Number(r[4])||null,serv:Number(r[5])||null,gen:Number(r[6])||null,ultMes:r[7]||''});
      }
    });
  }
  if(D.perfCoach && D.perfCoach.rows){
    D.perfCoach.rows.forEach(r=>{
      if(r[0]&&r[1]){
        const co=r[0];
        if(!D.perf.coachMes[co])D.perf.coachMes[co]=[];
        D.perf.coachMes[co].push({mes:r[1],res:Number(r[2])||null,serv:Number(r[3])||null,gen:Number(r[4])||null,ses:Number(r[5])||0});
      }
    });
  }
}

  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});

  renderT1();renderT2();renderT3();renderT4();
}

  ho+=kpi('Clientes con ≥3 Renovaciones',`${D.renov.countMeta} de ${D.renov.total}`,D.renov.total>0?D.renov.countMeta/D.renov.total*100:null,'Meta: al menos 3 renovaciones c/u','Operaciones');

    <div class="grid g2">

      const card=document.createElement('div');
      card.className='chart-card';
      card.innerHTML=`<div class="chart-title">${rb.name} · <span style="color:var(--text3);font-weight:600">${fmtM(total)} YTD</span></div><canvas id="${cid}" height="160"></canvas>`;
      grid.appendChild(card);

    });
  }
}

function renderT3(){
  const mi=D.mi,c=D.comercial;
  const wk=D.semanal||[];
  const lastWk=wk.length?wk[wk.length-1]:null;
  let h='';
  const ventaCaja=D.hist.v2026[mi]||0;
  const d=delta(ventaCaja,D.hist.v2026[mi>0?mi-1:0]);
  h+=kpi('Venta Caja',fmtM(ventaCaja),ventaCaja/META_MES*100,`Meta: ${fmtM(META_MES)} · <span class="${d.c}">${d.t}</span>`,'Dir. Comercial');
  h+=kpi('Ticket Promedio','$'+fmt(c.ticket[mi],0)+' USD',c.ticket[mi]>=2500?95:c.ticket[mi]>=2000?80:50,'Meta ≥$2,500 USD','Dir. Comercial');
  // CAC mensual = inversión del mes ÷ cierres del mes (en dinero)
  const cacMes=c.cierres[mi]>0?c.inversion[mi]/c.cierres[mi]:0;
  h+=kpi('CAC del Mes',cacMes>0?fmtM(cacMes):'S/I',cacMes>0?(cacMes<=20000?95:cacMes<=25000?80:50):null,'Inv. publicidad ÷ cierres (mes)','Marketing');
  h+=kpi('Cierres del Mes',String(c.cierres[mi]),c.cierres[mi]>=16?95:c.cierres[mi]>=12?80:50,'Meta: 16/mes (4/sem)','Dir. Comercial');

  // ---- Embudo SEMANAL: agendadas → confirmadas → oferta → cierres ----
  let funnel='';
  if(lastWk){
    const cfPct=lastWk.agendadas>0?lastWk.confirmadas/lastWk.agendadas*100:0;
    const ofPct=lastWk.confirmadas>0?lastWk.oferta/lastWk.confirmadas*100:0;
    const ciPct=lastWk.oferta>0?lastWk.cierres/lastWk.oferta*100:0;
    funnel=`<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Semana: <b>${lastWk.label}</b></div>
    <div class="funnel">
      <div class="funnel-step"><div class="funnel-icon">📅</div><div class="funnel-label">Sesiones Agendadas</div><div class="funnel-num">${lastWk.agendadas||'—'}</div></div>
      <div class="funnel-arrow"><span>→</span>${fmtPct(cfPct,0)}</div>
      <div class="funnel-step"><div class="funnel-icon">✔️</div><div class="funnel-label">Sesiones Confirmadas</div><div class="funnel-num">${lastWk.confirmadas}</div></div>
      <div class="funnel-arrow"><span>→</span>${fmtPct(ofPct,0)}</div>
      <div class="funnel-step"><div class="funnel-icon">📄</div><div class="funnel-label">Oferta Presentada</div><div class="funnel-num">${lastWk.oferta}</div></div>
      <div class="funnel-arrow"><span>→</span>${fmtPct(ciPct,0)}</div>
      <div class="funnel-step"><div class="funnel-icon">✅</div><div class="funnel-label">Cierres</div><div class="funnel-num">${lastWk.cierres}</div></div>
    </div>`;
  } else {
    funnel=`<div style="padding:24px;text-align:center;color:var(--text3)">Sin datos semanales. Verifica el nombre de la pestaña <b>${COMERCIAL_TAB_SEMANAL}</b> y el mapeo de columnas (COM_COL) arriba en el código.</div>`;
  }

  // ---- Embudo: tabla últimas semanas ----
  let wkTbl='';
  if(wk.length){
    const last=wk.slice(-8);
    wkTbl='<thead><tr><th>Semana</th><th class="num">Agendadas</th><th class="num">Confirmadas</th><th class="num">Oferta</th><th class="num">Cierres</th><th class="num">Inv. Pub</th><th class="num">CAC</th></tr></thead><tbody>';
    last.forEach(w=>{
      wkTbl+=`<tr><td style="font-weight:600">${w.label}</td><td class="num">${w.agendadas}</td><td class="num">${w.confirmadas}</td><td class="num">${w.oferta}</td><td class="num">${w.cierres}</td><td class="num">${fmtM(w.inversion)}</td><td class="num">${w.cac>0?fmtM(w.cac):'—'}</td></tr>`;
    });
    wkTbl+='</tbody>';
  }

  // ---- Calidad de venta ----
  let hq='';
  hq+=kpi('Venta Volumen (USD)','$'+fmt(c.ventaVol[mi],0),null,'Contratos firmados','Dir. Comercial',false);
  hq+=kpi('Venta Caja (USD)','$'+fmt(c.ventaCaja[mi],0),null,c.ventaVol[mi]>0?fmtPct(c.ventaCaja[mi]/c.ventaVol[mi]*100,0)+' del volumen':'','Finanzas',false);
  hq+=kpi('Inversión Publicitaria (Mes)',fmtM(c.inversion[mi]),null,'Total del mes actual','Marketing',false);
  const cvPct=c.convPct[mi];
  hq+=kpi('% Conversión',fmtPct(cvPct,1),cvPct>=25?95:cvPct>=20?80:50,'Meta ≥25%','Dir. Comercial');

  document.getElementById('p2').innerHTML=`
    <div class="page-title">Motor Comercial (Ventas)</div><div class="page-subtitle">¿Estamos vendiendo bien y con eficiencia? · Semanal</div>
    <div class="section-label">Eficiencia Comercial</div><div class="grid g4">${h}</div>
    <div class="section-label">Embudo Comercial — Semana Actual</div><div class="card">${funnel}</div>
    ${wkTbl?`<div class="section-label">Embudo por Semana</div><div class="chart-card"><div class="chart-title">Embudo Semanal</div><canvas id="cFunnelSem" height="140"></canvas></div><div class="chart-card" style="overflow-x:auto;margin-top:16px"><table class="tbl">${wkTbl}</table></div>`:''}
    <div class="section-label">Calidad de Venta — Bloque B</div><div class="grid g4">${hq}</div>
    <div class="section-label">Histórico Mensual</div>
    <div class="grid g2">
      <div class="chart-card"><div class="chart-title">Ventas Caja vs Meta</div><canvas id="cVentasC" height="220"></canvas></div>
      <div class="chart-card"><div class="chart-title">CAC Mensual ($)</div><canvas id="cCacMes" height="220"></canvas></div>
    </div>`;

  if(wk.length){
    const wl=wk.slice(-8);
    charts.cFunnelSem=new Chart(document.getElementById('cFunnelSem'),{type:'bar',data:{labels:wl.map(w=>w.label),datasets:[
      {label:'Agendadas',data:wl.map(w=>w.agendadas),backgroundColor:'#b4c4ee',borderRadius:4},
      {label:'Confirmadas',data:wl.map(w=>w.confirmadas),backgroundColor:'#5b8af0',borderRadius:4},
      {label:'Oferta',data:wl.map(w=>w.oferta),backgroundColor:'#3b6de0',borderRadius:4},
      {label:'Cierres',data:wl.map(w=>w.cierres),backgroundColor:'#1a2342',borderRadius:4},
    ]},options:{indexAxis:'y',responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:12,font:{size:10,family:'Plus Jakarta Sans'}}}},scales:{x:{beginAtZero:true,grid:{color:'#e5e7ee'},ticks:{font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  }

  charts.cVentasC=new Chart(document.getElementById('cVentasC'),{type:'bar',data:{labels:D.mLabels,datasets:[
    {label:'Ventas Caja 2026',data:D.hist.v2026.slice(0,D.activeMonths),backgroundColor:'#1a2342',borderRadius:6,barPercentage:.5},
    {label:'Meta',data:D.hist.meta.slice(0,D.activeMonths),type:'line',borderColor:'#3b6de0',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false},
  ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,font:{size:11,family:'Plus Jakarta Sans'}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v/1e6,1)+'M',font:{size:11}},grid:{color:'#e5e7ee'}},x:{grid:{display:false}}}}});

  // CAC mensual en $ = inversión del mes ÷ cierres del mes
  const cacMensual=D.mLabels.map((_,i)=>c.cierres[i]>0?c.inversion[i]/c.cierres[i]:null);
  charts.cCacMes=new Chart(document.getElementById('cCacMes'),{type:'bar',data:{labels:D.mLabels,datasets:[
    {label:'CAC ($)',data:cacMensual,backgroundColor:'#3b6de0',borderRadius:6,barPercentage:.6},
    {label:'Meta ≤$20K',data:D.mLabels.map(()=>20000),type:'line',borderColor:'#16a34a',borderDash:[5,4],borderWidth:1.5,pointRadius:0,fill:false},
  ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,font:{size:11,family:'Plus Jakarta Sans'}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+fmt(v/1e3)+'K',font:{size:11}},grid:{color:'#e5e7ee'}},x:{grid:{display:false}}}}});
}

function renderT4(){
  let h='';
  const vic=D.ops.coaches['Victoria']||{cuentas:0,cap:40};
  const jen=D.ops.coaches['Jenny']||{cuentas:0,cap:40};
  h+=kpi('Cuentas Activas',String(D.ops.activos),null,`${D.ops.recuperar} por recuperar · ${D.ops.inactivos} inactivos`,'Operaciones',false);
  h+=kpi('Cuentas Victoria',`${vic.cuentas} / 40`,vic.cuentas/40*100,`Ocupación ${fmtPct(vic.cuentas/40*100,0)} · límite 40`,'Operaciones');
  h+=kpi('Cuentas Jenny',`${jen.cuentas} / 40`,jen.cuentas/40*100,`Ocupación ${fmtPct(jen.cuentas/40*100,0)} · límite 40`,'Operaciones');
  h+=kpi('Clientes con ≥3 Renovaciones',`${D.renov.countMeta} de ${D.renov.total}`,D.renov.total>0?D.renov.countMeta/D.renov.total*100:null,'Meta: al menos 3 renovaciones c/u','Dir. General');

  // Coach capacity bars
  let cs='';
  Object.entries(D.ops.coaches).forEach(([name,d])=>{
    const pct=d.cap>0?d.cuentas/d.cap*100:0;
    cs+=`<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-weight:600;font-size:13px">${name}</span>
        <span style="font-family:var(--mono);font-size:14px;font-weight:600">${d.cuentas}/${d.cap}</span>
      </div>
      <div class="pbar"><div class="pbar-fill blue" style="width:${Math.min(100,pct)}%"></div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">Ocupación: ${fmtPct(pct,0)}</div>
    </div>`;
  });

  // ---- Performance por coach mes a mes ----
  // ---- Performance por coach: promedio de calificación (0-10) desde LS_Performance_Cuenta ----
  let perfCoachCharts='';
  const coachAgg={};
  if(D.perf&&D.perf.cuentas.length){
    D.perf.cuentas.forEach(p=>{
      const co=p.coach||'Sin asignar';
      if(!coachAgg[co])coachAgg[co]={res:[],serv:[],gen:[]};
      if(p.res!=null)coachAgg[co].res.push(p.res);
      if(p.serv!=null)coachAgg[co].serv.push(p.serv);
      if(p.gen!=null)coachAgg[co].gen.push(p.gen);
    });
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const coachNames=Object.keys(coachAgg).filter(c=>c&&c!=='Sin asignar');
  const hasCoachPerf=coachNames.length>0;
  if(hasCoachPerf){
    perfCoachCharts=`<div class="chart-card"><div class="chart-title">Calificación Promedio por Coach (escala 0–10)</div><canvas id="cPerfCoach" height="200"></canvas></div>`;
  }

  // ---- Performance por cuenta: tabla histórico (promedio) vs último mes ----
  let perfTbl='';
  if(D.perf&&D.perf.cuentas.length){
    const ordered=[...D.perf.cuentas].sort((a,b)=>(a.gen||0)-(b.gen||0)); // peores primero (riesgo)
    perfTbl='<thead><tr><th>Cuenta</th><th>Coach</th><th>Estatus</th><th class="num"># Ses.</th><th class="num">Resultados</th><th class="num">Servicio</th><th class="num">General</th><th>Últ. mes</th><th>Señal</th></tr></thead><tbody>';
    ordered.forEach(p=>{
      const g=p.gen||0;
      const tag=g>=9?'g':g>=7.5?'y':'r';
      const lbl=g>=9?'Sólido':g>=7.5?'Vigilar':'Riesgo';
      perfTbl+=`<tr><td style="font-weight:600">${p.alumno}</td><td>${p.coach||'—'}</td><td>${p.estatus||'—'}</td><td class="num">${p.sesiones}</td><td class="num">${p.res!=null?p.res.toFixed(1):'—'}</td><td class="num">${p.serv!=null?p.serv.toFixed(1):'—'}</td><td class="num">${p.gen!=null?p.gen.toFixed(1):'—'}</td><td>${p.ultMes||'—'}</td><td><span class="tag ${tag}">${lbl}</span></td></tr>`;
    });
    perfTbl+='</tbody>';
  } else {
    perfTbl=`<div style="padding:24px;text-align:center;color:var(--text3)">Aún no se detecta la pestaña <b>${PERF_CUENTA_TAB}</b> en tu Sheet de Operaciones. Cópiala y aparecerá aquí el histórico por cuenta.</div>`;
  }

  document.getElementById('p3').innerHTML=`
    <div class="page-title">Operaciones & Entrega</div><div class="page-subtitle">¿Estamos reteniendo y sirviendo bien?</div>
    <div class="section-label">Retención & Capacidad — Bloque A</div><div class="grid g4">${h}</div>
    <div class="section-label">Performance por Coach — Bloque B</div>
    <div class="grid g32">
      <div class="chart-card"><div class="chart-title">Comparativo Ventas 2022–2026</div><canvas id="cComp" height="200"></canvas></div>
      <div class="chart-card"><div class="chart-title">Capacidad por Coach</div>${cs}</div>
    </div>
    ${hasCoachPerf?`<div style="margin-top:16px">${perfCoachCharts}</div>`:''}
    <div class="section-label">Performance por Cuenta — Histórico vs Estado Actual</div>
    ${D.perf&&D.perf.cuentas.length?`<div class="chart-card" style="overflow-x:auto"><table class="tbl">${perfTbl}</table></div>`:`<div class="card">${perfTbl}</div>`}`;

  const allM=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  charts.cComp=new Chart(document.getElementById('cComp'),{type:'line',data:{labels:allM,datasets:[
    {label:'2026',data:D.hist.v2026.map(v=>v||null),borderColor:'#1a2342',borderWidth:3,pointRadius:5,pointBackgroundColor:'#1a2342',fill:false,tension:.15,spanGaps:false},
    {label:'Meta 2026',data:D.hist.meta,borderColor:'#3b6de0',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,tension:0},
    {label:'2025',data:D.hist.v2025,borderColor:'#8b90a4',borderWidth:1.5,pointRadius:3,pointBackgroundColor:'#8b90a4',fill:false,tension:.15},
    {label:'2024',data:D.hist.v2024,borderColor:'#d1d5e0',borderWidth:1,pointRadius:2,pointBackgroundColor:'#d1d5e0',fill:false,tension:.15},
  ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,font:{size:11,family:'Plus Jakarta Sans'}}}},elements:{line:{cubicInterpolationMode:'monotone'}},scales:{y:{beginAtZero:true,suggestedMax:Math.max(...D.hist.v2025,...D.hist.v2024,...D.hist.v2026.filter(v=>v))*1.05,ticks:{callback:v=>'$'+fmt(v/1e6,1)+'M',font:{size:11}},grid:{color:'#e5e7ee'}},x:{grid:{display:false}}}}});

  if(hasCoachPerf){
    charts.cPerfCoach=new Chart(document.getElementById('cPerfCoach'),{type:'bar',data:{labels:coachNames,datasets:[
      {label:'Resultados',data:coachNames.map(c=>avg(coachAgg[c].res)),backgroundColor:'#1a2342',borderRadius:5,barPercentage:.7},
      {label:'Servicio',data:coachNames.map(c=>avg(coachAgg[c].serv)),backgroundColor:'#3b6de0',borderRadius:5,barPercentage:.7},
      {label:'General',data:coachNames.map(c=>avg(coachAgg[c].gen)),backgroundColor:'#b4c4ee',borderRadius:5,barPercentage:.7},
    ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:16,font:{size:11,family:'Plus Jakarta Sans'}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y!=null?c.parsed.y.toFixed(1):'—')+'/10'}}},scales:{y:{min:0,max:10,ticks:{font:{size:11}},grid:{color:'#e5e7ee'}},x:{grid:{display:false},ticks:{font:{size:12,weight:'600'}}}}}});
  }
}

// ============ NAVIGATION ============
function show(i){
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('active',j===i));
  document.querySelectorAll('.nav-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
}

// ============ INIT ============
loadAll();
setInterval(loadAll, 300000); // Auto-refresh every 5 min
</script>
</body>
</html>
